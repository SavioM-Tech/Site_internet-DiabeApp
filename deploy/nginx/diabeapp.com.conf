# ──────────────────────────────────────────────────────────────────────────
# Vhost nginx — Site vitrine DiabeApp (diabeapp.com)
# VPS ZentralPro (179.237.84.180), à côté de /var/www/zentralrh
#
# Installation sur le VPS :
#   sudo cp diabeapp.com.conf /etc/nginx/sites-available/diabeapp.com
#   sudo ln -s /etc/nginx/sites-available/diabeapp.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Puis émettre le certificat (ajoutera automatiquement le bloc 443) :
#   sudo certbot --nginx -d diabeapp.com -d www.diabeapp.com
# ──────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name diabeapp.com www.diabeapp.com;

    root /var/www/diabeapp/public;
    index index.php;

    charset utf-8;

    # Laravel : tout passe par index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # PHP-FPM — vérifier le socket réellement présent : ls /run/php/
    # (aligner sur la version utilisée par zentralrh, ex. php8.5-fpm.sock)
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Bloquer l'accès aux fichiers cachés (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    client_max_body_size 20M;

    access_log /var/log/nginx/diabeapp.com-access.log;
    error_log  /var/log/nginx/diabeapp.com-error.log;
}
